<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory</title>
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="./styles.css">
    <script src="./js/js-confetti.browser.js" defer></script>
    <script src="./js/app.js" defer></script>
</head>
<body>

        <header>
            <nav class="breadcrumb" aria-label="Vous êtes ici">
                <ol>
                    <li><a href="../index.html">Jeux</a></li>
                    <li><a href="./index-css.html">Memory CSS</a></li>
                </ol>
            </nav>
            <h1 id="name">Memory</h1>
        </header>

        <main>
            <section id="cards"></section>    
        </main>

        <footer>
            <div id="buttons">
                <button id="play-again" class="hidden">Rejouer</button>
            </div>
            <div id="cursor"></div>
            <div id="end-sentence" class="hidden"></div>
            <!-- annonces pour les lecteurs d'écran : paires trouvées, fin de partie -->
            <p id="live" class="sr-only" aria-live="polite"></p>
        </footer>

    <template id="card-question">
        <button type="button" class="card card-question">
            <span class="content">
                <span class="front">
                </span>
                <span class="back">
                </span>
            </span>
        </button>
    </template>
    <template id="card-description">
        <button type="button" class="card card-description">
            <span class="content">
                <span class="front">
                </span>
                <span class="back">
                </span>
            </span>
        </button>
    </template>

    <script type="module">
        // Les memory CSS reprennent les données et les thèmes des quiz CSS
        import data from '../quiz/js/data-css.js';

        import basics from '../quiz/js/data-quiz/css/00-data-basics.js';
        import boxModel from '../quiz/js/data-quiz/css/01-data-box-model.js';
        import flexbox from '../quiz/js/data-quiz/css/02-data-flexbox.js';
        import grid from '../quiz/js/data-quiz/css/03-data-cssgrid.js';
        import design from '../quiz/js/data-quiz/css/04-data-design.js';
        import mega from '../quiz/js/data-quiz/css/05-data-mega.js';

        const memoryList = {
            "css-basics": { quiz: basics, numberCards: 6 },
            boxmodel: { quiz: boxModel, numberCards: 6 },
            flexbox: { quiz: flexbox, numberCards: 6 },
            grid: { quiz: grid, numberCards: 6 },
            design: { quiz: design, numberCards: 6 },
            "css-mega": { quiz: mega, numberCards: 8 },
        };

        const urlParams = new URLSearchParams(window.location.search);
        const q = urlParams.get('q');

        if (q && memoryList[q.toLowerCase()]) {
            const { quiz, numberCards, title } = memoryList[q.toLowerCase()];
            // le memory attend { q, desc } ; les quiz utilisent { name, desc }
            const cards = data.map(d => ({ q: d.name, desc: d.desc }));
            app.init({ cards: quiz.allowed, numberCards, title: title ?? quiz.title }, cards);
        } else {
            document.location.href = './index-css.html';
        }
    </script>
    
</body>
</html>
